[package]
name = "opennever-forge-desktop"
version.workspace = true
description = "A modern, read-only-first editor for Neverwinter Nights modules"
authors = ["Karenax and OpenNever Forge contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opennever_forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aurora-asset-export = { path = "../../../crates/aurora-asset-export" }
aurora-core = { path = "../../../crates/aurora-core" }
aurora-erf = { path = "../../../crates/aurora-erf" }
aurora-edit = { path = "../../../crates/aurora-edit" }
aurora-index = { path = "../../../crates/aurora-index" }
aurora-migration = { path = "../../../crates/aurora-migration" }
aurora-nwscript = { path = "../../../crates/aurora-nwscript" }
aurora-project = { path = "../../../crates/aurora-project" }
aurora-gff = { path = "../../../crates/aurora-gff" }
aurora-world = { path = "../../../crates/aurora-world" }
aurora-tlk = { path = "../../../crates/aurora-tlk" }
aurora-2da = { path = "../../../crates/aurora-2da" }
aurora-dialogue = { path = "../../../crates/aurora-dialogue" }
aurora-dialogue-export = { path = "../../../crates/aurora-dialogue-export" }
aurora-agent = { path = "../../../crates/aurora-agent" }
hex.workspace = true
reqwest.workspace = true
sha2.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
