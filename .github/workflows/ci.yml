name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level=low
      - name: Typecheck frontend
        run: pnpm lint
      - name: Test frontend
        run: pnpm test:run
      - name: Measure frontend coverage
        run: pnpm --filter @opennever/desktop run coverage
      - name: Build frontend
        run: pnpm build
      - name: Enforce bundle and source budgets
        run: pnpm check:bundle
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Rust coverage runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Add LLVM tools preview
        run: rustup component add llvm-tools-preview
      - name: Test Rust with coverage
        run: cargo llvm-cov --workspace --lcov --output-path target/lcov.info
      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v6
        with:
          name: rust-coverage-lcov
          path: target/lcov.info
          if-no-files-found: error
      - name: Build Windows release candidate
        run: pnpm tauri build
      - name: Build MCP release companion
        run: cargo build --release -p opennever-mcp
      - name: Install Rust SBOM generator
        run: cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Create CycloneDX SBOMs
        shell: pwsh
        run: ./scripts/create_sbom.ps1 | Format-List
      - name: Create release manifest
        shell: pwsh
        run: ./scripts/create_release_manifest.ps1 -OutputPath target/release/release-manifest.json -RequireClean | Format-List
      - name: Verify unsigned distribution bundle
        shell: pwsh
        run: ./scripts/verify_distribution.ps1 -RequireClean | Format-List
      - name: Test Python tooling and synthetic fixtures
        run: python -m unittest discover -s tests -v
      - name: Check architecture graph freshness
        run: python scripts/architecture_graph.py check
      - name: Upload unsigned Windows candidate
        uses: actions/upload-artifact@v6
        with:
          name: opennever-forge-windows-unsigned
          if-no-files-found: error
          path: |
            target/release/opennever-forge-desktop.exe
            target/release/opennever-mcp.exe
            target/release/bundle/nsis/*.exe
            target/release/release-manifest.json
            target/release/SHA256SUMS
            target/release/sbom/*.cdx.json

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
