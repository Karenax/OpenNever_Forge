[workspace]
members = [
  "apps/desktop/src-tauri",
  "apps/opennever-mcp",
  "apps/opennever-migrate",
  "crates/aurora-core",
  "crates/aurora-erf",
  "crates/aurora-gff",
  "crates/aurora-resource",
  "crates/aurora-tlk",
  "crates/aurora-2da",
  "crates/aurora-nwscript",
  "crates/aurora-dialogue",
  "crates/aurora-dialogue-export",
  "crates/aurora-mdl",
  "crates/aurora-world",
  "crates/aurora-edit",
  "crates/aurora-project",
  "crates/aurora-asset-export",
  "crates/aurora-migration",
  "crates/aurora-index",
  "crates/aurora-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
hex = "0.4"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
